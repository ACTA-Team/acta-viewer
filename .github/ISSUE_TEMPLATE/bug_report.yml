name: Bug report
description: Report something that is not working as expected.
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click on ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser, OS and network (testnet / mainnet).
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, logs or credential IDs (never share private keys or secrets).
